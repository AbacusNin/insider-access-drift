name: validate-kusto
on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * 1"
jobs:
  kusto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,validation]"
      - name: Start Kustainer
        run: |
          docker run -d --name kustainer -p 8080:8080 \
            -e ACCEPT_EULA=Y \
            mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
      - name: Wait for the emulator
        # curl -s alone treats any response (404/405 included) as ready, so
        # require an actual successful mgmt call before trusting the engine.
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl -s --fail -X POST http://localhost:8080/v1/rest/mgmt \
                -H "Content-Type: application/json" \
                -d '{"csl":".show version"}' >/dev/null; then
              echo ready; ready=1; break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "Kustainer did not become ready in time" >&2
            exit 1
          fi
      - name: Run validation
        env:
          KUSTO_ENDPOINT: http://localhost:8080
        run: python scripts/validate_kusto.py
