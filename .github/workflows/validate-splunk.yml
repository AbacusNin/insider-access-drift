name: validate-splunk
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, keeps CI fast on normal pushes
jobs:
  splunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,validation]"
      - name: Start Splunk (Free license)
        run: |
          docker run -d --name splunk \
            -e SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com \
            -e SPLUNK_START_ARGS=--accept-license \
            -e SPLUNK_LICENSE_URI=Free \
            -e SPLUNK_PASSWORD=Changed-me-2026 \
            -e SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000 \
            -p 8000:8000 -p 8088:8088 -p 8089:8089 \
            splunk/splunk:latest
      - name: Wait for the Splunk container to be healthy
        run: |
          for i in $(seq 1 90); do
            state=$(docker inspect -f '{{.State.Status}}' splunk 2>/dev/null || echo missing)
            health=$(docker inspect -f '{{.State.Health.Status}}' splunk 2>/dev/null || echo none)
            echo "attempt $i: state=$state health=$health"
            if [ "$state" = "exited" ]; then docker logs --tail 150 splunk; exit 1; fi
            if [ "$health" = "healthy" ]; then break; fi
            sleep 10
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' splunk 2>/dev/null)" = "healthy" ] \
            || { echo "splunk not healthy in time" >&2; docker logs --tail 150 splunk; exit 1; }
      - name: Pin Splunk's own CA (TLS stays on)
        # The mgmt and HEC server certs are both signed by Splunk's default CA, so
        # pin that CA. A leaf-only pin cannot build a chain and fails verification.
        run: |
          echo "--- pem files in the image ---"
          docker exec splunk sh -c 'find /opt/splunk/etc/auth -maxdepth 3 -name "*.pem" 2>/dev/null' || true
          ca=$(docker exec splunk sh -c 'find /opt/splunk/etc/auth -name cacert.pem 2>/dev/null | head -1' | tr -d "\r")
          if [ -z "$ca" ]; then
            echo "cacert.pem not found; listing auth dir:"; docker exec splunk sh -c 'ls -R /opt/splunk/etc/auth' | head -60; exit 1
          fi
          docker exec splunk sh -c "cat '$ca'" > splunk-ca.pem
          echo "--- pinned CA bytes ---"; wc -c splunk-ca.pem
      - name: Wait for Splunk API and HEC, verified with the pinned CA
        run: |
          ready=0
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --cacert splunk-ca.pem \
              -u admin:Changed-me-2026 https://localhost:8089/services/server/info || echo 000)
            hec=$(curl -s -o /dev/null -w "%{http_code}" --cacert splunk-ca.pem \
              https://localhost:8088/services/collector/health || echo 000)
            echo "attempt $i: api=$api hec=$hec"
            if [ "$api" = "200" ] && [ "$hec" = "200" ]; then ready=1; break; fi
            sleep 10
          done
          [ "$ready" -eq 1 ] || { echo "Splunk API/HEC not ready in time" >&2; docker logs --tail 80 splunk; exit 1; }
      - name: Create index and run validation
        env:
          SPLUNK_PASSWORD: Changed-me-2026
          SPLUNK_HEC_TOKEN: 00000000-0000-0000-0000-000000000000
          SPLUNK_CA: splunk-ca.pem
        run: |
          curl -s --cacert splunk-ca.pem -u admin:Changed-me-2026 -X POST \
            https://localhost:8089/services/data/indexes -d name=access_events
          python scripts/validate_splunk.py
