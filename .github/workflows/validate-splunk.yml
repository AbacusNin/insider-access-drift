name: validate-splunk
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, keeps CI fast on normal pushes
jobs:
  splunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,validation]"
      - name: Start Splunk (Free license)
        run: |
          docker run -d --name splunk \
            -e SPLUNK_START_ARGS=--accept-license \
            -e SPLUNK_LICENSE_URI=Free \
            -e SPLUNK_PASSWORD=Changed-me-2026 \
            -e SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000 \
            -p 8000:8000 -p 8088:8088 -p 8089:8089 \
            splunk/splunk:latest
      - name: Wait for Splunk process to report running
        run: |
          for i in $(seq 1 60); do
            if docker exec splunk /opt/splunk/bin/splunk status | grep -q running; then
              echo ready; break
            fi
            sleep 10
          done
      - name: Pin the container CA (no disabled TLS verification)
        run: docker cp splunk:/opt/splunk/etc/auth/cacert.pem splunk-ca.pem
      - name: Wait for Splunk API and HEC to actually be ready
        # `splunk status` can report running before first-boot provisioning
        # (admin user, HEC token, index readiness) finishes, so probe the
        # real endpoints with the pinned CA before trusting the instance.
        run: |
          ready=0
          for i in $(seq 1 60); do
            api_code=$(curl -s -o /dev/null -w "%{http_code}" --cacert splunk-ca.pem \
              -u admin:Changed-me-2026 https://localhost:8089/services/server/info)
            hec_code=$(curl -s -o /dev/null -w "%{http_code}" --cacert splunk-ca.pem \
              https://localhost:8088/services/collector/health)
            if [ "$api_code" = "200" ] && [ "$hec_code" = "200" ]; then
              echo ready; ready=1; break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "Splunk API/HEC did not become ready in time" >&2
            exit 1
          fi
      - name: Create index and run validation
        env:
          SPLUNK_PASSWORD: Changed-me-2026
          SPLUNK_HEC_TOKEN: 00000000-0000-0000-0000-000000000000
          SPLUNK_CA: splunk-ca.pem
        run: |
          curl -s --cacert splunk-ca.pem -u admin:Changed-me-2026 -X POST \
            https://localhost:8089/services/data/indexes -d name=access_events
          python scripts/validate_splunk.py
